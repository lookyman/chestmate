plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	maven { url 'https://maven.terraformersmc.com/releases/' }
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"chestmate" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		server {
			runDir "runs/server"
		}
		// Dedicated server that behaves as if it lacked Chestmate (exercises the client-only click path).
		serverNoChestmate {
			server()
			name = "Minecraft Server (no Chestmate)"
			runDir "runs/server-no-chestmate"
			vmArg "-Dchestmate.disableServer=true"
		}
	}
}

// Dev servers use an offline-account client: accept the EULA and disable online mode, once, without touching worlds.
def devServerDirs = ["runs/server", "runs/server-no-chestmate"]
tasks.register("prepareDevServers") {
	def dirs = devServerDirs.collect { layout.projectDirectory.dir(it).asFile }
	doLast {
		dirs.each { dir ->
			dir.mkdirs()
			def eula = new File(dir, "eula.txt")
			if (!eula.exists()) eula.text = "eula=true\n"
			def props = new File(dir, "server.properties")
			if (!props.exists()) props.text = "online-mode=false\n"
		}
	}
}
tasks.configureEach { t ->
	if (t.name == "runServer" || t.name == "runServerNoChestmate") t.dependsOn("prepareDevServers")
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	// Dev only: lets the owner open the Chestmate config screen from runClient.
	localRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"

	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
	testImplementation platform("org.junit:junit-bom:5.13.4")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

test {
	useJUnitPlatform()
}

sourceSets.test.compileClasspath += sourceSets.client.output
sourceSets.test.runtimeClasspath += sourceSets.client.output
